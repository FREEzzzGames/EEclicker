<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Главное меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* 3 ЦВЕТОВЫЕ ТЕМЫ */
:root, [data-theme="dark"] {
  --portal-bg: rgba(20, 10, 10, 0.90);
  --border-col: rgba(255, 0, 0, 0.5);
  --accent-col: #ff0000;
  --title-col: #ffcc00;
  --btn-bg: rgba(40, 15, 15, 0.95);
  --glass-bg: rgba(30, 12, 12, 0.75);
  --text-main: #fff;
  --text-sub: #ff8888;
  --body-bg: #0a0505;
}
[data-theme="rose"] {
  --portal-bg: rgba(30, 10, 25, 0.92);
  --border-col: rgba(233, 30, 99, 0.6);
  --accent-col: #e91e63;
  --title-col: #ffeb3b;
  --btn-bg: rgba(60, 15, 40, 0.95);
  --glass-bg: rgba(45, 12, 32, 0.80);
  --text-main: #fff;
  --text-sub: #ff80ab;
  --body-bg: #150510;
}
[data-theme="light"] {
  --portal-bg: rgba(245, 247, 250, 0.95);
  --border-col: rgba(211, 47, 47, 0.4);
  --accent-col: #d32f2f;
  --title-col: #e65100;
  --btn-bg: rgba(255, 255, 255, 0.95);
  --glass-bg: rgba(230, 235, 245, 0.85);
  --text-main: #1a1a1a;
  --text-sub: #555555;
  --body-bg: #e0e4ec;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--body-bg);color:var(--text-main);font-family:monospace;overflow:hidden;transition: background 0.3s;}
body{
  padding:10px;display:flex;justify-content:center;align-items:center;
  background-size: cover; position: fixed; inset: 0;
}
.menu-container{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; justify-content: space-between;
  padding: 12px; z-index: 10;
  background: var(--portal-bg); border: 2.5px solid var(--border-col);
  border-radius: 16px; box-shadow: 0 0 35px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(6px);
  position: relative; overflow-y: auto;
  transition: background 0.3s ease, border-color 0.3s ease;
}
.menu-header { display: flex; justify-content: space-between; align-items: center; width: 100%; z-index: 2; gap: 4px; }
.header-right { display: flex; gap: 4px; align-items: center; }

.ctrl-btn {
  background: var(--glass-bg); border: 1.5px solid var(--accent-col); color: var(--text-main);
  padding: 4px 7px; border-radius: 7px; font-weight: bold; cursor: pointer; font-size: 9px;
  font-family: monospace;
}
.ctrl-btn:active { opacity: 0.7; }

.brand-section { display: flex; flex-direction: column; align-items: center; gap: 3px; margin: 2px 0; z-index: 2; }
.brand-logo {
  width: 55px; height: 55px; background: radial-gradient(circle, var(--accent-col) 0%, var(--btn-bg) 70%);
  border: 3px solid var(--title-col); border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 28px;
  box-shadow: 0 0 20px rgba(255,0,0,0.4);
  animation: pulseLogo 2s infinite ease-in-out;
}
@keyframes pulseLogo {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.brand-title { 
  font-size: 17px; font-weight: bold; color: var(--title-col); letter-spacing: 1.5px; 
  display: flex; align-items: center; justify-content: center; gap: 6px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.brand-title span.bold { font-weight: 900; font-size: 19px; color: var(--accent-col); }
.brand-title span.normal { font-weight: normal; color: var(--text-main); font-size: 15px; }
.brand-subtitle { font-size: 8px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 2px; }

.player-stats-card {
  background: var(--glass-bg); border: 1.5px solid var(--border-col);
  border-radius: 9px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left;
  z-index: 2; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
}
.stat-row { display: flex; justify-content: space-between; font-size: 10px; }
.stat-label { color: var(--text-sub); }
.stat-value { font-weight: bold; color: var(--title-col); }

.menu-actions { display: flex; flex-direction: column; gap: 5px; width: 100%; margin: 2px 0; z-index: 2; }
.menu-btn {
  width: 100%; background: var(--btn-bg);
  border: 2px solid var(--accent-col); border-radius: 8px; padding: 8px;
  color: var(--text-main); font-family: monospace; font-size: 11px; font-weight: bold;
  cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.1s;
}
.menu-btn:active { transform: scale(0.97); }
.menu-btn.primary {
  background: linear-gradient(135deg, rgba(255,204,0,0.4), rgba(200,150,0,0.85));
  border-color: var(--title-col); color: #000; font-size: 12.5px;
  box-shadow: 0 0 15px rgba(255,204,0,0.4);
}
.menu-footer { font-size: 8px; color: var(--text-sub); z-index: 2; }
</style>
</head>
<body data-theme="dark">

<div class="menu-container">
  <div class="menu-header">
    <button class="ctrl-btn" onclick="toggleLanguage()" id="langBtn">🇩🇪 DE</button>
    <div class="header-right">
      <button class="ctrl-btn" onclick="toggleTheme()" id="themeBtn">🌙 DARK</button>
      <button class="ctrl-btn" onclick="toggleSound()" id="soundBtn">🔊 ON</button>
    </div>
  </div>

  <div class="brand-section">
    <div class="brand-logo">▶️</div>
    <div>
      <div class="brand-title">
        <span class="bold">TUBE</span> <span class="normal">EMPIRE</span>
      </div>
      <div class="brand-subtitle" id="subtitleTxt">Blogger Tycoon Sim</div>
    </div>
  </div>

  <div class="player-stats-card">
    <div class="stat-row">
      <span class="stat-label" id="lblCapital">Баланс:</span>
      <span class="stat-value" id="menuMoneyVal">0.00 €</span>
    </div>
    <div class="stat-row">
      <span class="stat-label" id="lblEnergyStat">Просмотры:</span>
      <span class="stat-value" id="menuEnergyVal">0.0M</span>
    </div>
  </div>

  <div class="menu-actions">
    <a href="game.html" class="menu-btn primary" id="btnPlay">🔴 ЗАПИСАТЬ РОЛИК</a>
    <a href="collection.html" class="menu-btn" id="btnCollection">💎 Магазин блогера</a>
    <a href="gallery.html" class="menu-btn" id="btnGallery">🏆 Зал Наград</a>
    <a href="leaderboard.html" class="menu-btn" id="btnRanking">📊 Топ Каналов</a>
  </div>

  <div class="menu-footer">tube empire corporation v1.0</div>
</div>

<script>
const tg = window.Telegram.WebApp; 
if (tg && tg.ready) { tg.ready(); tg.expand(); }

let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
let currentLang = localStorage.getItem("freezzzLang") || "ru";
let currentTheme = localStorage.getItem("freezzzTheme") || "dark";

const menuLang = {
  ru: {
    subtitle: "Симулятор видеоблогера",
    capital: "Баланс:",
    energyStat: "Просмотры:",
    play: "🔴 ЗАПИСАТЬ РОЛИК",
    collection: "💎 Магазин блогера",
    gallery: "🏆 Зал Наград",
    ranking: "📊 Топ Каналов",
    soundOn: "🔊 ЗВУК ВКЛ",
    soundOff: "🔇 ЗВУК ВЫКЛ",
    themeDark: "🌙 DARK",
    themeRose: "🌸 ROSE",
    themeLight: "☀️ LIGHT"
  },
  de: {
    subtitle: "Blogger Tycoon Simulator",
    capital: "Guthaben:",
    energyStat: "Aufrufe:",
    play: "🔴 VIDEO AUFNEHMEN",
    collection: "💎 Blogger Shop",
    gallery: "🏆 Trophäenraum",
    ranking: "📊 Top Kanäle",
    soundOn: "🔊 TON AN",
    soundOff: "🔇 TON AUS",
    themeDark: "🌙 DARK",
    themeRose: "🌸 ROSE",
    themeLight: "☀️ LIGHT"
  }
};

function toggleLanguage() {
  currentLang = currentLang === "ru" ? "de" : "ru";
  localStorage.setItem("freezzzLang", currentLang);
  updateMenuUI();
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem("freezzzSound", soundEnabled);
  updateMenuUI();
}

function toggleTheme() {
  if (currentTheme === "dark") currentTheme = "rose";
  else if (currentTheme === "rose") currentTheme = "light";
  else currentTheme = "dark";

  localStorage.setItem("freezzzTheme", currentTheme);
  applyTheme();
  updateMenuUI();
}

function applyTheme() {
  document.body.setAttribute('data-theme', currentTheme);
}

function updateMenuUI() {
  let t = menuLang[currentLang];
  document.getElementById('subtitleTxt').textContent = t.subtitle;
  document.getElementById('lblCapital').textContent = t.capital;
  document.getElementById('lblEnergyStat').textContent = t.energyStat;
  document.getElementById('btnPlay').textContent = t.play;
  document.getElementById('btnCollection').textContent = t.collection;
  document.getElementById('btnGallery').textContent = t.gallery;
  document.getElementById('btnRanking').textContent = t.ranking;
  document.getElementById('langBtn').textContent = currentLang === "ru" ? "🇩🇪 DE" : "🇷🇺 RU";
  document.getElementById('soundBtn').textContent = soundEnabled ? t.soundOn : t.soundOff;

  let themeLabels = { dark: t.themeDark, rose: t.themeRose, light: t.themeLight };
  document.getElementById('themeBtn').textContent = themeLabels[currentTheme];

  let savedMoney = Number(localStorage.getItem("zeitarbeitMoney") || 0);
  let savedEnergy = Number(localStorage.getItem("zeitarbeitEnergy") || 0);
  
  document.getElementById('menuMoneyVal').textContent = savedMoney.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
  document.getElementById('menuEnergyVal').textContent = savedEnergy.toFixed(1) + (currentLang === 'ru' ? " млн" : " Mio");
}

applyTheme();
updateMenuUI();
</script>
</body>
</html>
