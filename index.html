<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Главное меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root, [data-theme="dark"] {
  --portal-bg: rgba(20, 10, 10, 0.94);
  --border-col: rgba(255, 0, 0, 0.5);
  --accent-col: #ff0000;
  --title-col: #ffcc00;
  --btn-bg: rgba(40, 15, 15, 0.95);
  --glass-bg: rgba(30, 12, 12, 0.8);
  --text-main: #fff;
  --text-sub: #ff8888;
  --body-bg: #0a0505;
}
[data-theme="rose"] {
  --portal-bg: rgba(30, 10, 25, 0.94);
  --border-col: rgba(233, 30, 99, 0.6);
  --accent-col: #e91e63;
  --title-col: #ffeb3b;
  --btn-bg: rgba(60, 15, 40, 0.95);
  --glass-bg: rgba(45, 12, 32, 0.85);
  --text-main: #fff;
  --text-sub: #ff80ab;
  --body-bg: #150510;
}
[data-theme="light"] {
  --portal-bg: rgba(245, 247, 250, 0.95);
  --border-col: rgba(211, 47, 47, 0.4);
  --accent-col: #d32f2f;
  --title-col: #e65100;
  --btn-bg: rgba(255, 255, 255, 0.95);
  --glass-bg: rgba(230, 235, 245, 0.9);
  --text-main: #1a1a1a;
  --text-sub: #555555;
  --body-bg: #e0e4ec;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--body-bg);color:var(--text-main);font-family:monospace;overflow:hidden;transition: background 0.3s;}
body{
  padding:6px;display:flex;justify-content:center;align-items:center;
  position: fixed; inset: 0;
}
.menu-container{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; justify-content: space-between;
  padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2.5px solid var(--border-col);
  border-radius: 14px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(6px);
  position: relative; overflow-y: auto;
}
.menu-header { display: flex; justify-content: space-between; align-items: center; width: 100%; z-index: 2; gap: 4px; flex-shrink: 0; }
.header-right { display: flex; gap: 4px; align-items: center; }

.ctrl-btn {
  background: var(--glass-bg); border: 1.5px solid var(--accent-col); color: var(--text-main);
  padding: 3px 6px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 8.5px;
  font-family: monospace;
}
.ctrl-btn:active { opacity: 0.7; }

/* УЛУЧШЕННАЯ ЭРГОНОМИЧНАЯ КАРТОЧКА ПРОФИЛЯ */
.profile-card {
  display: flex; align-items: center; gap: 8px; background: var(--glass-bg);
  border: 1.5px solid var(--border-col); border-radius: 10px; padding: 6px 8px;
  cursor: pointer; transition: transform 0.1s; z-index: 2; flex-shrink: 0;
}
.profile-card:active { transform: scale(0.98); }
.profile-avatar-box {
  width: 42px; height: 42px; background: radial-gradient(circle, var(--accent-col) 0%, var(--btn-bg) 70%);
  border: 2px solid var(--title-col); border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  overflow: hidden; text-align: center; line-height: 1; padding: 2px;
}
.profile-info { display: flex; flex-direction: column; text-align: left; width: 100%; gap: 1px; }
.profile-name { font-size: 9.5px; font-weight: bold; color: var(--title-col); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.profile-sub { font-size: 7px; color: var(--text-sub); }

.player-stats-card {
  background: var(--glass-bg); border: 1.5px solid var(--border-col);
  border-radius: 8px; padding: 5px 8px; display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; flex-shrink: 0;
}
.stat-row { display: flex; justify-content: space-between; font-size: 9px; }
.stat-label { color: var(--text-sub); }
.stat-value { font-weight: bold; color: var(--title-col); }

/* КОМПАКТНЫЙ ВИДЖЕТ МИНИ-ЧАТА */
.chat-preview-card {
  background: var(--glass-bg); border: 1.5px dashed var(--accent-col);
  border-radius: 8px; padding: 4px 7px; width: 100%; text-align: left; cursor: pointer;
  transition: transform 0.1s; z-index: 2; flex-shrink: 0;
}
.chat-preview-card:active { transform: scale(0.98); }
.chat-preview-header { display: flex; justify-content: space-between; align-items: center; font-size: 8px; font-weight: bold; color: var(--title-col); margin-bottom: 2px; }
.chat-mini-msg { font-size: 7px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
.chat-mini-msg span { color: var(--text-main); font-weight: bold; }

.menu-actions { display: flex; flex-direction: column; gap: 3.5px; width: 100%; z-index: 2; flex-shrink: 0; }
.menu-btn {
  width: 100%; background: var(--btn-bg);
  border: 1.5px solid var(--accent-col); border-radius: 7px; padding: 6px;
  color: var(--text-main); font-family: monospace; font-size: 10px; font-weight: bold;
  cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.menu-btn:active { transform: scale(0.97); }
.menu-btn.primary {
  background: linear-gradient(135deg, rgba(255,204,0,0.4), rgba(200,150,0,0.85));
  border-color: var(--title-col); color: #000; font-size: 11px;
  box-shadow: 0 0 10px rgba(255,204,0,0.3);
}
.menu-btn.lottery {
  background: linear-gradient(135deg, rgba(241, 196, 15, 0.35), rgba(211, 84, 0, 0.85));
  border-color: #f1c40f; color: #ffcc00;
  box-shadow: 0 0 8px rgba(241, 196, 15, 0.25);
}
.menu-footer { font-size: 7px; color: var(--text-sub); z-index: 2; flex-shrink: 0; }

/* МОДАЛЬНОЕ ОКНО ОСНОВНОГО ЧАТА */
.modal-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 12px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-content {
  background: var(--portal-bg); border: 2.5px solid var(--title-col); border-radius: 12px;
  padding: 10px; text-align: center; width: 100%; max-width: 360px; height: 360px;
  display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 25px rgba(255,204,0,0.4);
}
.chat-messages-box {
  flex-grow: 1; background: var(--glass-bg); border: 1px solid var(--border-col);
  border-radius: 8px; padding: 5px; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 5px; margin: 5px 0;
}
.chat-msg-item { font-size: 8px; background: rgba(0,0,0,0.2); padding: 3px 5px; border-radius: 5px; border-left: 2px solid var(--accent-col); }
.chat-msg-sender { font-weight: bold; color: var(--title-col); margin-bottom: 1px; }
.chat-msg-text { color: var(--text-main); word-break: break-all; }
.chat-input-area { display: flex; gap: 4px; }
.chat-input {
  flex-grow: 1; background: var(--glass-bg); border: 1.5px solid var(--border-col);
  border-radius: 6px; padding: 5px; color: var(--text-main); font-family: monospace; font-size: 8.5px;
}
.chat-send-btn {
  background: var(--title-col); border: none; border-radius: 6px; padding: 5px 9px;
  font-weight: bold; cursor: pointer; font-size: 8.5px; color: #000;
}
.chat-cooldown-info { font-size: 7px; color: var(--text-sub); margin-top: 2px; }
</style>
</head>
<body data-theme="dark">

<div class="menu-container">
  <div class="menu-header">
    <button class="ctrl-btn" onclick="toggleLanguage()" id="langBtn">🇩🇪 DE</button>
    <div class="header-right">
      <button class="ctrl-btn" onclick="toggleTheme()" id="themeBtn">🌙 DARK</button>
      <button class="ctrl-btn" onclick="toggleSound()" id="soundBtn">🔊 ON</button>
    </div>
  </div>

  <!-- КАРТОЧКА ПРОФИЛЯ -->
  <div class="profile-card" onclick="window.location.href='avatar.html'">
    <div class="profile-avatar-box" id="headerAvatarDisplay">👦</div>
    <div class="profile-info">
      <div class="profile-name" id="profileNameTxt">TUBE EMPIRE PRO</div>
      <div class="profile-sub" id="profileSubTxt">Нажмите для настройки профиля ⚙️</div>
    </div>
  </div>

  <div class="player-stats-card">
    <div class="stat-row">
      <span class="stat-label" id="lblCapital">Баланс:</span>
      <span class="stat-value" id="menuMoneyVal">0.00 €</span>
    </div>
    <div class="stat-row">
      <span class="stat-label" id="lblEnergyStat">Просмотры:</span>
      <span class="stat-value" id="menuEnergyVal">0.0M</span>
    </div>
  </div>

  <!-- ВИДЖЕТ МИНИ-ЧАТА -->
  <div class="chat-preview-card" onclick="openFullChat()">
    <div class="chat-preview-header">
      <span id="chatWidgetTitle">💬 Глобальный чат</span>
      <span>▶</span>
    </div>
    <div id="miniChatContainer"></div>
  </div>

  <div class="menu-actions">
    <a href="game.html" class="menu-btn primary" id="btnPlay">🔴 ЗАПИСАТЬ РОЛИК</a>
    <a href="lottery.html" class="menu-btn lottery" id="btnLottery">🎟️ Лотерея</a>
    <a href="collection.html" class="menu-btn" id="btnCollection">💎 Магазин блогера</a>
    <a href="gallery.html" class="menu-btn" id="btnGallery">🏆 Зал Наград</a>
    <a href="leaderboard.html" class="menu-btn" id="btnRanking">📊 Топ Каналов</a>
  </div>

  <div class="menu-footer">tube empire corporation v1.0</div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ОСНОВНОГО ЧАТА -->
<div class="modal-overlay" id="chatModalOverlay" onclick="closeFullChat()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div style="font-size: 10.5px; font-weight: bold; color: var(--title-col);" id="modalChatTitle">💬 ГЛОБАЛЬНЫЙ ЧАТ БЛОГЕРОВ</div>
    
    <div class="chat-messages-box" id="fullChatMessages"></div>

    <div>
      <div class="chat-input-area">
        <input type="text" id="chatInputText" class="chat-input" placeholder="Написать в чат..." maxlength="150">
        <button class="chat-send-btn" onclick="sendChatMessage()" id="chatSendBtnTxt">ОТПРАВИТЬ</button>
      </div>
      <div class="chat-cooldown-info" id="chatCooldownTxt">Отправка сообщений доступна раз в 10 минут.</div>
    </div>

    <button class="ctrl-btn" style="width:100%; padding:5px; background:#333; margin-top:3px;" onclick="closeFullChat()" id="chatCloseBtnTxt">ЗАКРЫТЬ</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; 
if (tg && tg.ready) { tg.ready(); tg.expand(); }

function getSavedAvatarString() {
  try {
    let saved = JSON.parse(localStorage.getItem("tube_empire_avatar_config"));
    if (!saved) return "👦👤👕👖";
    const opts = {
      gender: [{symbol: '👦'}, {symbol: '👧'}],
      head: [{icon: '👤'}, {icon: '🧢'}, {icon: '🎧'}, {icon: '🕶️'}, {icon: '👑'}],
      torso: [{icon: '👕'}, {icon: '🧥'}, {icon: '👔'}, {icon: '🥼'}, {icon: '👚'}],
      legs: [{icon: '👖'}, {icon: '🩳'}, {icon: '🏃'}, {icon: '👗'}, {icon: '🥻'}],
      accessory: [{icon: '❌'}, {icon: '🎙️'}, {icon: '📷'}, {icon: '📱'}, {icon: '💵'}]
    };
    let g = opts.gender[saved.gender || 0].symbol;
    let h = opts.head[saved.head || 0].icon;
    let t = opts.torso[saved.torso || 0].icon;
    let l = opts.legs[saved.legs || 0].icon;
    let acc = opts.accessory[saved.accessory || 0].icon;
    return `${g}${h}${t}${l}${acc !== '❌' ? acc : ''}`;
  } catch(e) {
    return "👦👤👕👖";
  }
}

class GlobalChatModule {
  constructor() {
    this.storageKey = "tube_empire_global_chat";
    this.cooldownKey = "tube_empire_chat_cooldown";
    this.cooldownTime = 10 * 60 * 1000;
    
    if (!localStorage.getItem(this.storageKey)) {
      const initialMessages = [
        { sender: "🔴 MrBeast", avatar: "👑👕💵👖", text: "Снимаю новое видео с островом!", time: Date.now() - 3600000 },
        { sender: "🎮 PewDiePie", avatar: "🎧🧥👖👖", text: "Привет всем из Японии!", time: Date.now() - 1800000 },
        { sender: "🎧 Marshmello", avatar: "🧢👕👖👟", text: "Готовлю трек для коллабы века.", time: Date.now() - 600000 }
      ];
      localStorage.setItem(this.storageKey, JSON.stringify(initialMessages));
    }
  }

  getMessages() {
    try { return JSON.parse(localStorage.getItem(this.storageKey)) || []; } catch (e) { return []; }
  }

  getRecentMessages(count = 3) {
    return this.getMessages().slice(-count).reverse();
  }

  getCooldownRemaining() {
    const lastSend = Number(localStorage.getItem(this.cooldownKey)) || 0;
    const elapsed = Date.now() - lastSend;
    if (elapsed < this.cooldownTime) {
      return Math.ceil((this.cooldownTime - elapsed) / 1000);
    }
    return 0;
  }

  sendMessage(senderName, avatarStr, text) {
    const cooldown = this.getCooldownRemaining();
    if (cooldown > 0) {
      return { success: false, error: `Подождите еще ${Math.ceil(cooldown / 60)} мин. перед отправкой.` };
    }
    if (!text || text.trim() === "") {
      return { success: false, error: "Сообщение не может быть пустым." };
    }

    const msgs = this.getMessages();
    msgs.push({
      sender: senderName || "Блогер",
      avatar: avatarStr || "👦👤👕👖",
      text: text.trim().substring(0, 150),
      time: Date.now()
    });

    if (msgs.length > 50) msgs.shift();

    localStorage.setItem(this.storageKey, JSON.stringify(msgs));
    localStorage.setItem(this.cooldownKey, Date.now());
    return { success: true };
  }
}

window.GlobalChat = new GlobalChatModule();

let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
let currentLang = localStorage.getItem("freezzzLang") || "ru";
let currentTheme = localStorage.getItem("freezzzTheme") || "dark";

const menuLang = {
  ru: {
    capital: "Баланс:",
    energyStat: "Просмотры:",
    play: "🔴 ЗАПИСАТЬ РОЛИК",
    lottery: "🎟️ Лотерея",
    collection: "💎 Магазин блогера",
    gallery: "🏆 Зал Наград",
    ranking: "📊 Топ Каналов",
    soundOn: "🔊 ЗВУК ВКЛ",
    soundOff: "🔇 ЗВУК ВЫКЛ",
    themeDark: "🌙 DARK",
    themeRose: "🌸 ROSE",
    themeLight: "☀️ LIGHT",
    chatTitle: "💬 Глобальный чат",
    modalChatTitle: "💬 ГЛОБАЛЬНЫЙ ЧАТ БЛОГЕРОВ",
    sendBtn: "ОТПРАВИТЬ",
    closeBtn: "ЗАКРЫТЬ",
    profileSub: "Нажмите для настройки профиля ⚙️",
    placeholder: "Написать в чат...",
    cooldownInfo: "Отправка сообщений доступна раз в 10 минут.",
    waitCooldown: "⏳ Подождите: ",
    playerName: "Вы (TUBE EMPIRE)"
  },
  de: {
    capital: "Guthaben:",
    energyStat: "Aufrufe:",
    play: "🔴 VIDEO AUFNEHMEN",
    lottery: "🎟️ Lotterie",
    collection: "💎 Blogger Shop",
    gallery: "🏆 Trophäenraum",
    ranking: "📊 Top Kanäle",
    soundOn: "🔊 TON AN",
    soundOff: "🔇 TON AUS",
    themeDark: "🌙 DARK",
    themeRose: "🌸 ROSE",
    themeLight: "☀️ LIGHT",
    chatTitle: "💬 Globaler Chat",
    modalChatTitle: "💬 GLOBALER BLOGGER CHAT",
    sendBtn: "SENDEN",
    closeBtn: "SCHLIESSEN",
    profileSub: "Klicken zum Anpassen ⚙️",
    placeholder: "Nachricht schreiben...",
    cooldownInfo: "Nachrichten alle 10 Minuten möglich.",
    waitCooldown: "⏳ Warten Sie: ",
    playerName: "Du (TUBE EMPIRE)"
  }
};

function toggleLanguage() {
  currentLang = currentLang === "ru" ? "de" : "ru";
  localStorage.setItem("freezzzLang", currentLang);
  updateMenuUI();
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem("freezzzSound", soundEnabled);
  updateMenuUI();
}

function toggleTheme() {
  if (currentTheme === "dark") currentTheme = "rose";
  else if (currentTheme === "rose") currentTheme = "light";
  else currentTheme = "dark";

  localStorage.setItem("freezzzTheme", currentTheme);
  applyTheme();
  updateMenuUI();
}

function applyTheme() {
  document.body.setAttribute('data-theme', currentTheme);
}

function updateMiniChatWidget() {
  const recent = window.GlobalChat.getRecentMessages(3);
  let html = "";
  if (recent.length === 0) {
    html = `<div class="chat-mini-msg">Пока нет сообщений...</div>`;
  } else {
    recent.forEach(m => {
      html += `<div class="chat-mini-msg">${m.avatar || ''} <span>${m.sender}:</span> ${m.text}</div>`;
    });
  }
  document.getElementById('miniChatContainer').innerHTML = html;
}

function openFullChat() {
  updateFullChatWindow();
  document.getElementById('chatModalOverlay').classList.add('active');
}

function closeFullChat() {
  document.getElementById('chatModalOverlay').classList.remove('active');
}

function updateFullChatWindow() {
  const msgs = window.GlobalChat.getMessages();
  let html = "";
  msgs.slice(-20).reverse().forEach(m => {
    html += `
      <div class="chat-msg-item">
        <div class="chat-msg-sender">${m.avatar || ''} ${m.sender}</div>
        <div class="chat-msg-text">${m.text}</div>
      </div>
    `;
  });
  document.getElementById('fullChatMessages').innerHTML = html;
  
  const cd = window.GlobalChat.getCooldownRemaining();
  let t = menuLang[currentLang];
  let cdInfoElem = document.getElementById('chatCooldownTxt');
  if (cd > 0) {
    let mins = Math.floor(cd / 60);
    let secs = cd % 60;
    cdInfoElem.textContent = `${t.waitCooldown} ${mins} мин. ${secs} сек.`;
  } else {
    cdInfoElem.textContent = t.cooldownInfo;
  }
}

function sendChatMessage() {
  let t = menuLang[currentLang];
  let input = document.getElementById('chatInputText');
  let result = window.GlobalChat.sendMessage(t.playerName, getSavedAvatarString(), input.value);
  
  if (result.success) {
    input.value = "";
    updateFullChatWindow();
    updateMiniChatWidget();
  } else {
    alert(result.error);
  }
}

function updateMenuUI() {
  let t = menuLang[currentLang];
  document.getElementById('lblCapital').textContent = t.capital;
  document.getElementById('lblEnergyStat').textContent = t.energyStat;
  document.getElementById('btnPlay').textContent = t.play;
  document.getElementById('btnLottery').textContent = t.lottery;
  document.getElementById('btnCollection').textContent = t.collection;
  document.getElementById('btnGallery').textContent = t.gallery;
  document.getElementById('btnRanking').textContent = t.ranking;
  document.getElementById('langBtn').textContent = currentLang === "ru" ? "🇩🇪 DE" : "🇷🇺 RU";
  document.getElementById('soundBtn').textContent = soundEnabled ? t.soundOn : t.soundOff;

  document.getElementById('chatWidgetTitle').textContent = t.chatTitle;
  document.getElementById('modalChatTitle').textContent = t.modalChatTitle;
  document.getElementById('chatSendBtnTxt').textContent = t.sendBtn;
  document.getElementById('chatCloseBtnTxt').textContent = t.closeBtn;
  document.getElementById('chatInputText').placeholder = t.placeholder;
  document.getElementById('profileSubTxt').textContent = t.profileSub;
  document.getElementById('headerAvatarDisplay').textContent = getSavedAvatarString();

  // Подтягиваем актуальное имя из Telegram профиля для шапки карточки
  let username = "TUBE EMPIRE PRO";
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    username = tg.initDataUnsafe.user.first_name || tg.initDataUnsafe.user.username || username;
  }
  document.getElementById('profileNameTxt').textContent = username;

  let themeLabels = { dark: t.themeDark, rose: t.themeRose, light: t.themeLight };
  document.getElementById('themeBtn').textContent = themeLabels[currentTheme];

  let savedMoney = Number(localStorage.getItem("zeitarbeitMoney") || 0);
  let savedEnergy = Number(localStorage.getItem("zeitarbeitEnergy") || 0);
  
  document.getElementById('menuMoneyVal').textContent = savedMoney.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
  document.getElementById('menuEnergyVal').textContent = savedEnergy.toFixed(1) + (currentLang === 'ru' ? " млн" : " Mio");
}

applyTheme();
updateMenuUI();
updateMiniChatWidget();
</script>
</body>
</html>
