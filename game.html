<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>eckert electro — Производство</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: linear-gradient(135deg, #09192b 0%, #112d4e 50%, #06111c 100%);
  --portal-bg: rgba(10, 22, 38, 0.96);
  --border-col: rgba(74, 144, 226, 0.4);
  --accent-col: #4a90e2;
  --title-col: #ffd52c;
  --btn-bg: rgba(18, 48, 80, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --housing-col: #3498db;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#06111c;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:6px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; justify-content: space-between;
  padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 16px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.85);
  position: relative;
}

/* ШАПКА */
.game-ui-header { 
  display: flex; justify-content: space-between; align-items: center; 
  padding: 5px 8px; background: var(--btn-bg); border: 1px solid var(--border-col); 
  border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 11px; 
}
.header-left { display: flex; gap: 6px; align-items: center; }

/* КРАСНАЯ КНОПКА ВОЗВРАТА */
.back-btn {
  background: rgba(217, 30, 30, 0.85); border: 1px solid #ff4d4d; color: #fff;
  padding: 3px 6px; border-radius: 6px; text-decoration: none; font-weight: bold;
  cursor: pointer; font-size: 8px; letter-spacing: -0.5px;
  transition: transform 0.1s;
}
.back-btn:active { transform: scale(0.95); background: rgba(180, 20, 20, 1); }

.lang-btn {
  background: rgba(74, 144, 226, 0.25); border: 1px solid var(--accent-col); color: #fff;
  padding: 3px 7px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px;
}
.lang-btn:active { background: rgba(74, 144, 226, 0.5); }

/* КОМПОЗИЦИЯ ИГРОВОГО ЭКРАНА */
.clicker-body {
  flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 2px 0; width: 100%; gap: 6px; overflow: hidden;
}

/* РЕСУРСЫ */
.resources-container { display: flex; gap: 6px; width: 100%; }
.res-box {
  flex: 1; background: var(--glass-bg); border: 1px solid var(--border-col); border-radius: 8px;
  padding: 5px; text-align: center;
}
.res-title { font-size: 7.5px; color: #a1c4fd; text-transform: uppercase; font-weight: bold; }
.res-val { font-size: 15px; font-weight: bold; color: var(--title-col); text-shadow: 0 0 8px rgba(255,213,44,0.5); margin-top: 1px; }
.res-sub { font-size: 7.5px; color: var(--accent-col); margin-top: 1px; }

/* ЭФФЕКТ МОЛНИЙ */
@keyframes electricSpark {
  0% { text-shadow: 0 0 4px #20e8ff, 0 0 8px #20e8ff; color: #6bc5ff; }
  50% { text-shadow: 0 0 10px #ffffff, 0 0 18px #20e8ff; color: #ffffff; }
  100% { text-shadow: 0 0 4px #20e8ff, 0 0 8px #20e8ff; color: #6bc5ff; }
}
.energy-lightning { animation: electricSpark 1.2s infinite ease-in-out; }

/* ТРУБА ПОТОКА */
.money-pipe {
  width: 100%; height: 8px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(74, 144, 226, 0.3);
  border-radius: 4px; position: relative; overflow: hidden;
}
.money-flow {
  position: absolute; top: 0; left: -100%; width: 200%; height: 100%;
  background: repeating-linear-gradient(90deg, transparent, transparent 8px, #ffd52c 8px, #ffd52c 14px, #ffffff 14px, #ffffff 18px);
  opacity: 0.75;
  animation: flowMoney 1.5s linear infinite;
}
@keyframes flowMoney {
  0% { transform: translateX(0); }
  100% { transform: translateX(50%); }
}

/* КНОПКА ПРОДАЖИ */
.sell-energy-btn {
  width: 100%; background: linear-gradient(135deg, rgba(255,213,44,0.2), rgba(74,144,226,0.2));
  border: 1px solid var(--title-col); border-radius: 6px; padding: 6px; color: var(--title-col);
  font-family: monospace; font-size: 9.5px; font-weight: bold; cursor: pointer; text-align: center;
  transition: transform 0.1s; box-shadow: 0 0 6px rgba(255,213,44,0.15);
}
.sell-energy-btn:active { transform: scale(0.97); }

/* ПРОГРЕСС-БАР */
.progress-bar-container {
  width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, #4a90e2, #ffd52c); width: 0%; transition: width 0.2s ease;
}

/* УМЕНЬШЕННАЯ ОБЛАСТЬ КНОПКИ ГЕНЕРАЦИИ */
.click-target-container { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 1px 0; }
.click-target {
  width: 72px; height: 72px; background: radial-gradient(circle at 35% 35%, #ffd52c, #d39e00);
  border: 3px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center;
  font-size: 34px; cursor: pointer; box-shadow: 0 0 15px rgba(255,213,44,0.4); transition: transform 0.08s ease;
  user-select: none; z-index: 40; touch-action: manipulation;
}
.click-target:active { transform: scale(0.88); background: radial-gradient(circle at 35% 35%, #e0b800, #997500); }

/* ЭРГОНОМИЧНЫЙ СПИСОК (АПГРЕЙДЫ И ЖИЛЬЕ) */
.upgrades-list { 
  width: 100%; display: flex; flex-direction: column; gap: 5px; 
  max-height: 150px; overflow-y: auto; padding-right: 2px; 
}
.upgrade-card {
  display: flex; justify-content: space-between; align-items: center; background: rgba(18, 48, 80, 0.85);
  border: 1px solid var(--border-col); border-radius: 8px; padding: 6px 9px; font-size: 10px; text-align: left; cursor: pointer;
  transition: all 0.12s ease; position: relative; min-height: 44px;
}
.upgrade-card:active { transform: scale(0.98); background: var(--btn-bg); }
.upgrade-info { display: flex; flex-direction: column; gap: 1px; }
.upgrade-name { color: var(--title-col); font-weight: bold; font-size: 10px; }
.upgrade-desc { font-size: 7.5px; color: #a1c4fd; }
.upgrade-cost { color: #6bc5ff; font-weight: bold; font-size: 8.5px; }
.upgrade-count { font-size: 10.5px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.5); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border-col); }

/* КАРТОЧКА ЖИЛЬЯ (СПЕЦИАЛЬНЫЙ СТИЛЬ) */
.upgrade-card.housing {
  border-color: var(--housing-col);
  background: rgba(52, 152, 219, 0.15);
}
.upgrade-card.housing .upgrade-name { color: #5dade2; }

/* АНИМАЦИЯ ЦИФР */
@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-35px) scale(1.2); opacity: 0; }
}
.floating-text {
  position: fixed; color: #ffd52c; font-size: 14px; font-weight: bold; pointer-events: none; z-index: 99999;
  animation: floatUp 0.4s ease-out forwards; text-shadow: 0 0 5px rgba(0,0,0,0.9);
}
</style>
</head>
<body>

<div class="portal">
  <div class="game-ui-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" id="menuBtnTxt">⬅ МЕНЮ</a>
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">🇩🇪 DE</button>
    </div>
    <div id="licenseTxt" style="color:var(--title-col); font-weight:bold; font-size: 10px;">⚡ ECKERT ELECTRO</div>
  </div>

  <div class="clicker-body">
    <div class="resources-container">
      <div class="res-box">
        <div class="res-title" id="resBudgetTitle">Бюджет (€)</div>
        <div class="res-val" id="moneyTxt">0.00 €</div>
        <div class="res-sub" id="cpsTxt">+0.0 €/сек</div>
      </div>
      <div class="res-box">
        <div class="res-title" id="resEnergyTitle">Энергия (МВт)</div>
        <div class="res-val energy-lightning" id="energyTxt">0.0 МВт</div>
        <div class="res-sub" id="housingSubTxt">Слоты: 0/0</div>
      </div>
    </div>

    <div class="money-pipe">
      <div class="money-flow" id="moneyFlow"></div>
    </div>

    <button class="sell-energy-btn" id="sellBtnTxt" onclick="sellEnergy()">⚡ ПРОДАТЬ ЭНЕРГИЮ (1 МВт = 2.50 €)</button>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <div class="click-target-container">
      <div class="click-target" onclick="clickEnergy(event)">⚡</div>
      <div style="font-size: 7.5px; color: #a1c4fd;" id="tapHintTxt">Тапай для подачи напряжения!</div>
    </div>

    <div class="upgrades-list" id="upgradesList"></div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; 
if (tg && tg.ready) { tg.ready(); tg.expand(); }

let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
let currentLang = localStorage.getItem("freezzzLang") || "ru";

const langData = {
  ru: {
    menu: "⬅ МЕНЮ",
    license: "⚡ ECKERT ELECTRO",
    budget: "Бюджет (€)",
    energy: "Энергия (МВт·ч)",
    sellBtn: "⚡ ПРОДАТЬ ЭНЕРГИЮ (1 МВт = 2.50 €)",
    tapHint: "Тапай для подачи напряжения!",
    price: "Цена",
    housingSlots: "Слоты жилья",
    noSlots: "❌ Нет жилых слотов!",
    items: [
      { name: "🏠 Вагончик для рабочих", desc: "+3 слота для сотрудников", type: "housing" },
      { name: "🏢 Общежитие концерна", desc: "+10 слотов для сотрудников", type: "housing" },
      { name: "🧑‍🎓 Стажер-практикант (Azubi)", desc: "Авто-кликер (требует жилье)", type: "worker" },
      { name: "👨‍🔧 Электрик (Специалист)", desc: "Базовый мастер (требует жилье)", type: "worker" },
      { name: "👷‍♂️ Бригада электриков", desc: "Монтажники (требует жилье)", type: "worker" },
      { name: "💨 Ветряная установка", desc: "Генератор зеленой энергии", type: "station" },
      { name: "☀️ Солнечная ферма", desc: "Панели (+ выработка МВт)", type: "station" },
      { name: "⚡ АЭС (Атомная станция)", desc: "Максимальная энергия и доход", type: "station" }
    ]
  },
  de: {
    menu: "⬅ MENÜ",
    license: "⚡ ECKERT ELECTRO",
    budget: "Budget (€)",
    energy: "Energie (MWh)",
    sellBtn: "⚡ ENERGIE VERKAUFEN (1 MWh = 2.50 €)",
    tapHint: "Tippen für Stromversorgung!",
    price: "Preis",
    housingSlots: "Wohnplätze",
    noSlots: "❌ Keine Wohnplätze frei!",
    items: [
      { name: "🏠 Bauwagen (Unterkunft)", desc: "+3 Plätze für Personal", type: "housing" },
      { name: "🏢 Firmenwohnheim", desc: "+10 Plätze für Personal", type: "housing" },
      { name: "🧑‍🎓 Azubi (Praktikant)", desc: "Auto-Klicker (braucht Unterkunft)", type: "worker" },
      { name: "👨‍🔧 Elektriker (Spezialist)", desc: "Grundmonteur (braucht Unterkunft)", type: "worker" },
      { name: "👷‍♂️ Elektriker-Team", desc: "Trupp (braucht Unterkunft)", type: "worker" },
      { name: "💨 Windkraftanlage", desc: "Grüne Windenergie", type: "station" },
      { name: "☀️ Solarpark", desc: "Solarpanels (+ MWh)", type: "station" },
      { name: "⚡ Atomkraftwerk (AKW)", desc: "Maximale Energie & Ertrag", type: "station" }
    ]
  }
};

function toggleLanguage() {
  currentLang = currentLang === "ru" ? "de" : "ru";
  localStorage.setItem("freezzzLang", currentLang);
  updateLanguageUI();
  updateUI();
}

function updateLanguageUI() {
  let t = langData[currentLang];
  document.getElementById('menuBtnTxt').textContent = t.menu;
  document.getElementById('licenseTxt').textContent = t.license;
  document.getElementById('resBudgetTitle').textContent = t.budget;
  document.getElementById('resEnergyTitle').textContent = t.energy;
  document.getElementById('sellBtnTxt').textContent = t.sellBtn;
  document.getElementById('tapHintTxt').textContent = t.tapHint;
  document.getElementById('langBtn').textContent = currentLang === "ru" ? "🇩🇪 DE" : "🇷🇺 RU";
}

let money = Number(localStorage.getItem("zeitarbeitMoney") || 0);
let totalEnergyMWh = Number(localStorage.getItem("zeitarbeitEnergy") || 0);

// Инициализация структуры апгрейдов, жилья и работников
let upgrades = [
  { id: 'wagon', cost: 100, housingSlots: 3, count: Number(localStorage.getItem("up_wagon") || 0), mult: 1.25, type: 'housing' },
  { id: 'dorm', cost: 800, housingSlots: 10, count: Number(localStorage.getItem("up_dorm") || 0), mult: 1.30, type: 'housing' },
  { id: 'azubi', cost: 25, incomeEur: 0.1, energyMWh: 0.05, count: Number(localStorage.getItem("up_azubi") || 0), mult: 1.12, type: 'worker' },
  { id: 'elektrik', cost: 150, incomeEur: 0.4, energyMWh: 0.1, count: Number(localStorage.getItem("up_elektrik") || 0), mult: 1.15, type: 'worker' },
  { id: 'brigade', cost: 1200, incomeEur: 2, energyMWh: 0.8, count: Number(localStorage.getItem("up_brigade") || 0), mult: 1.18, type: 'worker' },
  { id: 'wind', cost: 9500, incomeEur: 14, energyMWh: 8.5, workersNeeded: 2, count: Number(localStorage.getItem("up_wind") || 0), mult: 1.20, type: 'station' },
  { id: 'solar', cost: 120000, incomeEur: 110, energyMWh: 65, workersNeeded: 8, count: Number(localStorage.getItem("up_solar") || 0), mult: 1.22, type: 'station' },
  { id: 'aes', cost: 1500000, incomeEur: 850, energyMWh: 450, workersNeeded: 30, count: Number(localStorage.getItem("up_aes") || 0), mult: 1.25, type: 'station' }
];

let audioCtx = null;
function playSound(freq, type='square', duration=0.1) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function haptic(style='light') {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred(style); } catch(e){}
  }
}

// Подсчет общего жилья (слотов) и занятых мест
function getHousingStats() {
  let totalSlots = 0;
  let usedSlots = 0;

  upgrades.forEach(up => {
    if (up.type === 'housing') {
      totalSlots += up.count * up.housingSlots;
    }
    if (up.type === 'worker') {
      usedSlots += up.count;
    }
  });

  return { totalSlots, usedSlots };
}

function clickEnergy(e) {
  money += 1;
  totalEnergyMWh += 0.2;
  playSound(520, 'triangle', 0.08);
  haptic('light');
  updateUI();

  let pop = document.createElement('div');
  pop.textContent = "+1 € / ⚡";
  pop.className = "floating-text";
  pop.style.left = (e.clientX - 15) + "px";
  pop.style.top = (e.clientY - 25) + "px";
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 400);
}

function sellEnergy() {
  if (totalEnergyMWh < 1) {
    playSound(150, 'sawtooth', 0.15);
    return;
  }
  let earned = totalEnergyMWh * 2.50;
  money += earned;
  totalEnergyMWh = 0;
  playSound(880, 'square', 0.2);
  haptic('heavy');
  updateUI();
}

function buyUpgrade(index) {
  let up = upgrades[index];
  let housing = getHousingStats();

  // Проверка: если это работник, проверяем наличие свободных слотов жилья
  if (up.type === 'worker') {
    let freeSlots = housing.totalSlots - housing.usedSlots;
    if (freeSlots <= 0) {
      playSound(120, 'sawtooth', 0.2);
      haptic('heavy');
      return;
    }
  }

  if (money >= up.cost) {
    money -= up.cost;
    up.count++;
    up.cost = Math.floor(up.cost * up.mult);
    localStorage.setItem("up_" + up.id, up.count);
    playSound(720, 'square', 0.15);
    haptic('medium');
    updateUI();
  } else {
    playSound(140, 'sawtooth', 0.2);
  }
}

function calculateStats() {
  let totalEurSec = 0;
  let totalEnergySec = 0;
  let housing = getHousingStats();
  
  upgrades.forEach(up => {
    if (up.type === 'worker') {
      totalEurSec += up.incomeEur * up.count;
      totalEnergySec += up.energyMWh * up.count;
    } else if (up.type === 'station') {
      let requiredWorkersTotal = (up.workersNeeded || 0) * up.count;
      let efficiency = requiredWorkersTotal > 0 ? Math.min(1.0, housing.usedSlots / requiredWorkersTotal) : 1.0;
      if (housing.usedSlots === 0 && requiredWorkersTotal > 0) efficiency = 0.1;

      totalEurSec += (up.incomeEur * up.count) * efficiency;
      totalEnergySec += (up.energyMWh * up.count) * efficiency;
    }
  });

  return { totalEurSec, totalEnergySec };
}

function updateUI() {
  let stats = calculateStats();
  let housing = getHousingStats();
  let t = langData[currentLang];
  
  document.getElementById('moneyTxt').textContent = money.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
  document.getElementById('cpsTxt').textContent = `+${stats.totalEurSec.toFixed(1)} €/s`;
  
  document.getElementById('energyTxt').textContent = totalEnergyMWh.toFixed(1) + (currentLang === 'ru' ? " МВт" : " MWh");
  document.getElementById('housingSubTxt').textContent = `${currentLang === 'ru' ? 'Жилье' : 'Wohnen'}: ${housing.usedSlots}/${housing.totalSlots}`;

  let flowSpeed = Math.max(0.3, 2.0 - (stats.totalEurSec / 20));
  document.getElementById('moneyFlow').style.animationDuration = flowSpeed + 's';

  let cheapestCost = Math.min(...upgrades.map(u => u.cost));
  let progressPercent = Math.min(100, (money / cheapestCost) * 100);
  document.getElementById('progressFill').style.width = progressPercent + "%";

  let listHtml = "";
  upgrades.forEach((up, idx) => {
    let currentCost = Math.floor(up.cost);
    let canBuy = money >= currentCost;
    let localizedItem = t.items[idx];
    
    let subInfo = localizedItem.desc;
    if (up.type === 'worker') {
      let freeSlots = housing.totalSlots - housing.usedSlots;
      canBuy = canBuy && freeSlots > 0;
      subInfo = freeSlots > 0 ? `+${up.incomeEur}€/s, +${up.energyMWh}MWh/s` : `<span style="color:#e74c3c">${t.noSlots}</span>`;
    }

    listHtml += `
      <div class="upgrade-card ${up.type === 'housing' ? 'housing' : ''}" style="opacity: ${canBuy ? 1 : 0.6}; border-color: ${canBuy ? 'var(--title-col)' : 'var(--border-col)'};" onclick="buyUpgrade(${idx})">
        <div class="upgrade-info">
          <div class="upgrade-name">${localizedItem.name}</div>
          <div class="upgrade-desc">${subInfo}</div>
          <div class="upgrade-cost">${t.price}: ${currentCost.toLocaleString()} €</div>
        </div>
        <div class="upgrade-count">${up.count}</div>
      </div>
    `;
  });
  
  document.getElementById('upgradesList').innerHTML = listHtml;
  localStorage.setItem("zeitarbeitMoney", money);
  localStorage.setItem("zeitarbeitEnergy", totalEnergyMWh);
}

setInterval(() => {
  let stats = calculateStats();
  if (stats.totalEurSec > 0 || stats.totalEnergySec > 0) {
    money += stats.totalEurSec / 10;
    totalEnergyMWh += stats.totalEnergySec / 10;
    updateUI();
  }
}, 100);

setInterval(() => {
  localStorage.setItem("zeitarbeitMoney", money);
  localStorage.setItem("zeitarbeitEnergy", totalEnergyMWh);
}, 5000);

updateLanguageUI();
updateUI();
</script>
</body>
</html>
