<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Конструктор аватара</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root, [data-theme="dark"] {
  --portal-bg: rgba(20, 10, 10, 0.96);
  --border-col: rgba(255, 0, 0, 0.5);
  --accent-col: #ff0000;
  --title-col: #ffcc00;
  --btn-bg: rgba(40, 15, 15, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --text-main: #fff;
  --text-sub: #ff8888;
  --body-bg: #0a0505;
}
[data-theme="rose"] {
  --portal-bg: rgba(30, 10, 25, 0.96);
  --border-col: rgba(233, 30, 99, 0.6);
  --accent-col: #e91e63;
  --title-col: #ffeb3b;
  --btn-bg: rgba(60, 15, 40, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --text-main: #fff;
  --text-sub: #ff80ab;
  --body-bg: #150510;
}
[data-theme="light"] {
  --portal-bg: rgba(245, 247, 250, 0.96);
  --border-col: rgba(211, 47, 47, 0.4);
  --accent-col: #d32f2f;
  --title-col: #e65100;
  --btn-bg: rgba(255, 255, 255, 0.9);
  --glass-bg: rgba(230, 235, 245, 0.85);
  --text-main: #1a1a1a;
  --text-sub: #555555;
  --body-bg: #e0e4ec;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--body-bg);color:var(--text-main);font-family:monospace;overflow:hidden;transition:background 0.3s;}
body{
  padding:6px;display:flex;justify-content:center;align-items:center;
  position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; justify-content: space-between;
  padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2.5px solid var(--border-col);
  border-radius: 16px; box-shadow: 0 0 35px rgba(0, 0, 0, 0.2);
  position: relative; overflow-y: auto;
}

.game-ui-header { 
  display: flex; justify-content: space-between; align-items: center; 
  padding: 5px 8px; background: var(--btn-bg); border: 1.5px solid var(--border-col); 
  border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 11px; 
}
.back-btn {
  background: rgba(217, 30, 30, 0.85); border: 1px solid #ff4d4d; color: #fff;
  padding: 3px 6px; border-radius: 6px; text-decoration: none; font-weight: bold; cursor: pointer; font-size: 8px;
}

/* КОМПАНОВКА: АВАТАР СЛЕВА, НАСТРОЙКИ СПРАВА */
.constructor-main-layout {
  display: flex; gap: 8px; align-items: stretch; margin: 4px 0; flex-shrink: 0;
}
.avatar-preview-box {
  flex: 0 0 110px; background: var(--glass-bg); border: 1.5px solid var(--border-col);
  border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px; gap: 4px;
}
.constructor-preview {
  font-size: 40px; background: radial-gradient(circle, var(--accent-col) 0%, var(--btn-bg) 70%);
  border: 2px solid var(--title-col); border-radius: 50%; width: 62px; height: 62px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(255,204,0,0.4);
}
.avatar-title-text { font-size: 8px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; }

.categories-tabs {
  flex-grow: 1; display: flex; flex-direction: column; gap: 3px; justify-content: space-between;
}
.tab-btn {
  background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px;
  padding: 6px 8px; font-size: 9px; color: var(--text-main); font-family: monospace;
  text-align: left; cursor: pointer; font-weight: bold; transition: all 0.1s;
}
.tab-btn:active { transform: scale(0.97); }
.tab-btn.active {
  background: var(--accent-col); border-color: var(--title-col); color: #fff;
  box-shadow: 0 0 8px rgba(255,0,0,0.3);
}

/* СЛОТЫ ВЫБОРА КОНКРЕТНОГО ВАРИАНТА */
.options-selection-box {
  flex-grow: 1; background: var(--glass-bg); border: 1px solid var(--border-col);
  border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; text-align: left; margin: 2px 0; max-height: 180px;
}
.section-title-label { font-size: 8px; color: var(--text-sub); text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
.options-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.option-tile {
  background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px;
  padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; font-family: monospace; font-size: 16px; transition: transform 0.1s;
}
.option-tile:active { transform: scale(0.92); }
.option-tile.active {
  border: 2px solid var(--title-col); background: rgba(255,204,0,0.15); box-shadow: 0 0 8px rgba(255,204,0,0.3);
}
.option-name { font-size: 6.5px; color: var(--text-main); margin-top: 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.save-btn {
  width: 100%; background: linear-gradient(135deg, var(--title-col), #c09a00); border: none;
  border-radius: 8px; padding: 9px; font-weight: bold; font-size: 10px; color: #000; cursor: pointer;
  box-shadow: 0 0 12px rgba(255,204,0,0.4); font-family: monospace; flex-shrink: 0;
}
.save-btn:active { transform: scale(0.97); }
</style>
</head>
<body data-theme="dark">

<div class="portal">
  <div class="game-ui-header">
    <a href="index.html" class="back-btn" id="menuBtnTxt">⬅ МЕНЮ</a>
    <div style="color:var(--title-col); font-weight:bold; font-size: 10px;" id="headerTitle">👤 КОНСТРУКТОР АВАТАРА</div>
  </div>

  <!-- КОМПАНОВКА: ПРЕВЬЬЮ СЛЕВА, КАТЕГОРИИ СПРАВА -->
  <div class="constructor-main-layout">
    <div class="avatar-preview-box">
      <div class="constructor-preview" id="modalAvatarPreview">👦</div>
      <div class="avatar-title-text" id="previewSubTxt">Блогер</div>
    </div>
    <div class="categories-tabs" id="categoriesTabsContainer"></div>
  </div>

  <!-- СЕТКА ВЫБОРА ЭЛЕМЕНТОВ ДЛЯ АКТИВНОЙ КАТЕГОРИИ -->
  <div class="options-selection-box" id="optionsSelectionContainer">
    <div class="section-title-label" id="activeCategoryLabel">Выберите элемент</div>
    <div class="options-grid" id="optionsGridContainer"></div>
  </div>

  <button class="save-btn" onclick="saveAndReturn()" id="saveBtnTxt">💾 СОХРАНИТЬ И ВЕРНУТЬСЯ</button>
</div>

<script>
const tg = window.Telegram.WebApp; 
if (tg && tg.ready) { tg.ready(); tg.expand(); }

let currentLang = localStorage.getItem("freezzzLang") || "ru";
let currentTheme = localStorage.getItem("freezzzTheme") || "dark";
document.body.setAttribute('data-theme', currentTheme);

const langData = {
  ru: {
    menu: "⬅ МЕНЮ", title: "👤 КОНСТРУКТОР АВАТАРА",
    sub: "Блогер", save: "💾 СОХРАНИТЬ И ВЕРНУТЬСЯ", selectEl: "Выберите элемент",
    categories: { gender: "Пол", head: "Голова", torso: "Торс", legs: "Ноги", accessory: "Аксессуар" }
  },
  de: {
    menu: "⬅ ZURÜCK", title: "👤 AVATAR EDITOR",
    sub: "Blogger", save: "💾 SPEICHERN & ZURÜCK", selectEl: "Element wählen",
    categories: { gender: "Geschlecht", head: "Kopf", torso: "Oberkörper", legs: "Beine", accessory: "Zubehör" }
  }
};

const avatarOptions = {
  gender: [
    { id: 'm', name: 'Парень', symbol: '👦' },
    { id: 'f', name: 'Девушка', symbol: '👧' }
  ],
  head: [
    { id: 'default', name: 'Обычная', icon: '👤' },
    { id: 'cap', name: 'Бейсболка', icon: '🧢' },
    { id: 'headphones', name: 'Наушники', icon: '🎧' },
    { id: 'glasses', name: 'Очки', icon: '🕶️' },
    { id: 'crown', name: 'Корона', icon: '👑' }
  ],
  torso: [
    { id: 'tshirt', name: 'Футболка', icon: '👕' },
    { id: 'hoodie', name: 'Худи', icon: '🧥' },
    { id: 'suit', name: 'Костюм', icon: '👔' },
    { id: 'jacket', name: 'Кожанка', icon: '🥼' },
    { id: 'top', name: 'Топ', icon: '👚' }
  ],
  legs: [
    { id: 'jeans', name: 'Джинсы', icon: '👖' },
    { id: 'shorts', name: 'Шорты', icon: '🩳' },
    { id: 'pants', name: 'Спортивки', icon: '🏃' },
    { id: 'skirt', name: 'Юбка', icon: '👗' },
    { id: 'kilt', name: 'Килт', icon: '🥻' }
  ],
  accessory: [
    { id: 'none', name: 'Нет', icon: '❌' },
    { id: 'mic', name: 'Микрофон', icon: '🎙️' },
    { id: 'cam', name: 'Камера', icon: '📷' },
    { id: 'phone', name: 'Телефон', icon: '📱' },
    { id: 'money', name: 'Купюры', icon: '💵' }
  ]
};

let storageKey = "tube_empire_avatar_config";
let defaultConfig = { gender: 0, head: 0, torso: 0, legs: 0, accessory: 0 };
let currentConfig = loadConfig();
let activeCategory = 'gender'; // Активная вкладка по умолчанию

function loadConfig() {
  try {
    let saved = JSON.parse(localStorage.getItem(storageKey));
    return saved ? { ...defaultConfig, ...saved } : { ...defaultConfig };
  } catch (e) { return { ...defaultConfig }; }
}

function getAvatarString() {
  let g = avatarOptions.gender[currentConfig.gender].symbol;
  let h = avatarOptions.head[currentConfig.head].icon;
  let t = avatarOptions.torso[currentConfig.torso].icon;
  let acc = avatarOptions.accessory[currentConfig.accessory].icon;
  return `${g}${h}${t}${acc !== '❌' ? acc : ''}`;
}

function renderUI() {
  let t = langData[currentLang];
  document.getElementById('menuBtnTxt').textContent = t.menu;
  document.getElementById('headerTitle').textContent = t.title;
  document.getElementById('previewSubTxt').textContent = t.sub;
  document.getElementById('saveBtnTxt').textContent = t.save;
  document.getElementById('activeCategoryLabel').textContent = `${t.selectEl} (${t.categories[activeCategory]}):`;

  document.getElementById('modalAvatarPreview').textContent = getAvatarString();

  // Рендерим вкладки категорий справа
  let tabsContainer = document.getElementById('categoriesTabsContainer');
  let tabsHtml = "";
  Object.keys(avatarOptions).forEach(cat => {
    let isActive = cat === activeCategory ? 'active' : '';
    tabsHtml += `<button class="tab-btn ${isActive}" onclick="setActiveCategory('${cat}')">${t.categories[cat]}</button>`;
  });
  tabsContainer.innerHTML = tabsHtml;

  // Рендерим сетку элементов для выбранной категории
  let gridContainer = document.getElementById('optionsGridContainer');
  let gridHtml = "";
  let list = avatarOptions[activeCategory];
  let currentSelectedIndex = currentConfig[activeCategory];

  list.forEach((item, idx) => {
    let isSelected = idx === currentSelectedIndex ? 'active' : '';
    let displayIcon = item.symbol || item.icon;
    gridHtml += `
      <div class="option-tile ${isSelected}" onclick="selectOption('${activeCategory}', ${idx})">
        <div>${displayIcon}</div>
        <div class="option-name">${item.name}</div>
      </div>
    `;
  });
  gridContainer.innerHTML = gridHtml;
}

function setActiveCategory(cat) {
  activeCategory = cat;
  renderUI();
}

function selectOption(category, index) {
  currentConfig[category] = index;
  localStorage.setItem(storageKey, JSON.stringify(currentConfig));
  renderUI();
}

function saveAndReturn() {
  window.location.href = "index.html";
}

renderUI();
</script>
</body>
</html>
